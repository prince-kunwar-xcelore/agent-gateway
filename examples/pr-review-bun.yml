# TEMPLATE — copy to .github/workflows/pr-review.yml in your repo.
#
# Uses Bun as the runtime — faster CI startup (~1s install), no build step needed.
# claude-token-proxy runs directly from TypeScript source via Bun.
#
# Pick the agent whose subscription reviews the PR with REVIEW_AGENT below.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   AGENT_GATEWAY_URL         — public URL of your proxy, e.g. https://you.ngrok-free.app
# Auth — one of:
#   Allowlist (no key):  start the proxy with `serve --allow <owner>/<repo>`. Nothing else needed;
#                        the job proves its identity with GitHub OIDC (id-token: write below).
#   Private key:         secret AGENT_GATEWAY_PRIVATE_KEY — contents of your private.pem,
#                        proxy started with `serve --public-key public.pem`.
#                        When this secret is set it takes precedence over OIDC.

name: PR Review

on:
  pull_request:
    types: [opened, synchronize]

env:
  REVIEW_AGENT: claude   # claude | codex

jobs:
  review:
    name: AI PR Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      checks: write     # neutral "AI review" check when the agent's usage limit is hit
      id-token: write   # lets the job request an OIDC token for the proxy allowlist

    steps:
      - name: Checkout PR repo
        uses: actions/checkout@v4

      - name: Checkout claude-token-proxy
        uses: actions/checkout@v4
        with:
          repository: prince-kunwar-xcelore/claude-token-proxy
          path: _claude-token-proxy

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install claude-token-proxy deps
        run: cd _claude-token-proxy && bun install

      - name: Checkout claude-audit-tool
        uses: actions/checkout@v4
        with:
          repository: prince-kunwar-xcelore/claude-audit-tool
          path: _claude-audit-tool

      - name: Install claude-audit-tool deps
        run: cd _claude-audit-tool && bun install

      - name: Install agent CLI
        run: |
          case "$REVIEW_AGENT" in
            claude) bun install -g @anthropic-ai/claude-code ;;
            codex)  bun install -g @openai/codex ;;
          esac

      - name: Run PR Review
        env:
          AGENT_GATEWAY_PRIVATE_KEY: ${{ secrets.AGENT_GATEWAY_PRIVATE_KEY }}
          AGENT_GATEWAY_URL: ${{ secrets.AGENT_GATEWAY_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          bun ${{ github.workspace }}/_claude-audit-tool/src/index.ts "$PR_URL" \
            --engine "$REVIEW_AGENT-cli" \
            --auth-token "$(bun ${{ github.workspace }}/_claude-token-proxy/src/index.ts decrypt-token --agent "$REVIEW_AGENT")"
