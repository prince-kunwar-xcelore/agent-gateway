# TEMPLATE — copy to .gitlab-ci.yml in your repo.
#
# Uses Node.js as the runtime — standard, universal.
# agent-gateway is built before running.
#
# Pick the agent whose subscription reviews the MR with REVIEW_AGENT below.
#
# Required GitLab CI/CD Variables (Settings → CI/CD → Variables):
#   AGENT_GATEWAY_URL         — public URL of your proxy, e.g. https://you.ngrok-free.app
#   GITLAB_TOKEN              — personal/project access token with `api` scope
#                                CI_JOB_TOKEN is NOT sufficient — it cannot post
#                                discussions or call /approve.
# Auth — one of:
#   Allowlist (no key):  start the proxy with `serve --allow gitlab:<group>/<project>`
#                        (self-hosted GitLab: `--allow gitlab@https://<host>:<group>/*`).
#                        The job proves its identity with the AGENT_GATEWAY_OIDC_TOKEN id_token below.
#   Private key:         variable AGENT_GATEWAY_PRIVATE_KEY — contents of your private.pem
#                        (mask + protect), proxy started with `serve --public-key public.pem`.
#                        Used only as a fallback when the OIDC allowlist request fails.

stages:
  - review

mr-review:
  stage: review
  image: node:20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  # pr-audit exits 3 when the agent's usage limit is hit: show "passed with warnings", not failed
  allow_failure:
    exit_codes: [3]
  id_tokens:
    AGENT_GATEWAY_OIDC_TOKEN:
      aud: agent-gateway
  variables:
    REVIEW_AGENT: claude   # claude | codex
    AGENT_AUTH_FILE: /tmp/agent-auth-$CI_JOB_ID
    GLAB_VERSION: "1.65.0"
    # Point glab at the same GitLab instance this pipeline is running on.
    # Required for self-hosted; harmless on gitlab.com.
    GITLAB_HOST: $CI_SERVER_HOST
  before_script:
    # Install glab CLI
    - apt-get update -qq && apt-get install -yqq curl tar
    - curl -fsSL -o /tmp/glab.tar.gz "https://gitlab.com/gitlab-org/cli/-/releases/v${GLAB_VERSION}/downloads/glab_${GLAB_VERSION}_Linux_x86_64.tar.gz"
    - tar -xzf /tmp/glab.tar.gz -C /tmp
    - install -m 755 /tmp/bin/glab /usr/local/bin/glab

    # Build agent-gateway
    - git clone --depth 1 https://github.com/prince-kunwar-xcelore/agent-gateway.git _agent-gateway
    - cd _agent-gateway && npm install -g pnpm && pnpm install && pnpm build && cd -

    # Install pr-audit globally (provides `pr-audit` on PATH)
    - git clone --depth 1 https://github.com/prince-kunwar-xcelore/pr-audit.git _pr-audit
    - cd _pr-audit && npm install && npm run build && npm install -g . && cd -

    # Install the agent CLI
    - if [ "$REVIEW_AGENT" = codex ]; then npm install -g @openai/codex; else npm install -g @anthropic-ai/claude-code; fi
  script:
    # Credentials go to a 0600 file outside the checkout, never on a command line (GitLab can't
    # mask values created at runtime, so they must not be printed). If decrypt-token fails, the
    # job stops here with its real error.
    - umask 077
    - node ${CI_PROJECT_DIR}/_agent-gateway/dist/index.js decrypt-token --agent "$REVIEW_AGENT" > "$AGENT_AUTH_FILE"
    - pr-audit
        "${CI_MERGE_REQUEST_PROJECT_URL}/-/merge_requests/${CI_MERGE_REQUEST_IID}"
        --engine "$REVIEW_AGENT-cli"
        --auth-token-file "$AGENT_AUTH_FILE"
  after_script:
    - rm -f "$AGENT_AUTH_FILE"
