# TEMPLATE — copy to .gitlab-ci.yml in your repo.
#
# Uses Node.js as the runtime — standard, universal.
# claude-token-proxy is built before running.
#
# Pick the agent whose subscription reviews the MR with REVIEW_AGENT below.
#
# Required GitLab CI/CD Variables (Settings → CI/CD → Variables):
#   CLAUDE_PROXY_URL          — public URL of your proxy, e.g. https://you.ngrok-free.app
#   GITLAB_TOKEN              — personal/project access token with `api` scope
#                                CI_JOB_TOKEN is NOT sufficient — it cannot post
#                                discussions or call /approve.
# Auth — one of:
#   Allowlist (no key):  start the proxy with `serve --allow <group>/<project>`
#                        (add `--oidc-issuer https://<host>` for self-hosted GitLab).
#                        The job proves its identity with the PROXY_OIDC_TOKEN id_token below.
#   Private key:         variable CLAUDE_PROXY_PRIVATE_KEY — contents of your private.pem
#                        (mask + protect), proxy started with `serve --public-key public.pem`.
#                        When set it takes precedence over OIDC.

stages:
  - review

mr-review:
  stage: review
  image: node:20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  id_tokens:
    PROXY_OIDC_TOKEN:
      aud: agent-token-proxy
  variables:
    REVIEW_AGENT: claude   # claude | codex
    GLAB_VERSION: "1.65.0"
    # Point glab at the same GitLab instance this pipeline is running on.
    # Required for self-hosted; harmless on gitlab.com.
    GITLAB_HOST: $CI_SERVER_HOST
  before_script:
    # Install glab CLI
    - apt-get update -qq && apt-get install -yqq curl tar
    - curl -fsSL -o /tmp/glab.tar.gz "https://gitlab.com/gitlab-org/cli/-/releases/v${GLAB_VERSION}/downloads/glab_${GLAB_VERSION}_Linux_x86_64.tar.gz"
    - tar -xzf /tmp/glab.tar.gz -C /tmp
    - install -m 755 /tmp/bin/glab /usr/local/bin/glab

    # Build claude-token-proxy
    - git clone --depth 1 https://github.com/prince-kunwar-xcelore/claude-token-proxy.git _claude-token-proxy
    - cd _claude-token-proxy && npm install -g pnpm && pnpm install && pnpm build && cd -

    # Install pr-audit globally (provides `pr-audit` on PATH)
    - git clone --depth 1 https://github.com/prince-kunwar-xcelore/claude-audit-tool.git _claude-audit-tool
    - cd _claude-audit-tool && npm install && npm run build && npm install -g . && cd -

    # Install the agent CLI
    - if [ "$REVIEW_AGENT" = codex ]; then npm install -g @openai/codex; else npm install -g @anthropic-ai/claude-code; fi
  script:
    - pr-audit "${CI_MERGE_REQUEST_PROJECT_URL}/-/merge_requests/${CI_MERGE_REQUEST_IID}"
        --engine "$REVIEW_AGENT-cli"
        --auth-token "$(node ${CI_PROJECT_DIR}/_claude-token-proxy/dist/index.js decrypt-token --agent $REVIEW_AGENT)"
