# TEMPLATE — copy to .github/workflows/pr-review.yml in your repo.
#
# Uses Node.js as the runtime — standard, universal.
# Both claude-token-proxy and claude-audit-tool run directly from TypeScript source via tsx.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   CLAUDE_PROXY_PRIVATE_KEY  — contents of your private.pem
#   CLAUDE_PROXY_URL          — public URL of your machine, e.g. http://1.2.3.4:7432

name: PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    name: Claude PR Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout PR repo
        uses: actions/checkout@v4

      - name: Checkout claude-token-proxy
        uses: actions/checkout@v4
        with:
          repository: prince-kunwar-xcelore/claude-token-proxy
          path: _claude-token-proxy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install claude-token-proxy deps
        run: cd _claude-token-proxy && npm install

      - name: Checkout claude-audit-tool
        uses: actions/checkout@v4
        with:
          repository: prince-kunwar-xcelore/claude-audit-tool
          path: _claude-audit-tool

      - name: Install claude-audit-tool deps
        run: cd _claude-audit-tool && npm install

      - name: Install Claude CLI and tsx
        run: npm install -g @anthropic-ai/claude-code tsx

      - name: Run PR Review
        env:
          CLAUDE_PROXY_PRIVATE_KEY: ${{ secrets.CLAUDE_PROXY_PRIVATE_KEY }}
          PROXY_URL: ${{ secrets.CLAUDE_PROXY_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tsx ${{ github.workspace }}/_claude-audit-tool/src/index.ts "${{ github.event.pull_request.html_url }}" \
            --auth-token "tsx ${{ github.workspace }}/_claude-token-proxy/src/index.ts decrypt-token"
