# TEMPLATE — copy to .github/workflows/pr-review.yml in your repo.
#
# Uses Node.js as the runtime — standard, universal.
# claude-token-proxy is built with tsup before running.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   CLAUDE_PROXY_PRIVATE_KEY  — contents of your private.pem
#   CLAUDE_PROXY_URL          — public URL of your machine, e.g. http://1.2.3.4:7432

name: PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    name: Claude PR Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup claude-token-proxy
        run: |
          git clone https://github.com/dell-4xz8ls3/claude-token-proxy.git /tmp/claude-token-proxy
          cd /tmp/claude-token-proxy
          npm install -g pnpm
          pnpm install
          pnpm build

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install pr-audit
        run: |
          git clone https://github.com/dell-4xz8ls3/pr-audit.git /tmp/pr-audit
          cd /tmp/pr-audit && npm install && npm run build
          npm install -g /tmp/pr-audit

      - name: Run PR Review
        env:
          CLAUDE_PROXY_PRIVATE_KEY: ${{ secrets.CLAUDE_PROXY_PRIVATE_KEY }}
          PROXY_URL: ${{ secrets.CLAUDE_PROXY_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr-audit "${{ github.event.pull_request.html_url }}" \
            --auth-token "node /tmp/claude-token-proxy/dist/index.js decrypt-token"
